async function dbLoad() {

  if(error) throw error;
  return data ? data.data : [];
}

function cleanName(raw,osNum){
  if(!raw) return '';
  let s=String(raw).trim();
  if(osNum) s=s.replace(new RegExp('^'+osNum+'\s*[-–]\s*','i'),'');
  return s.replace(/^\d+\s*[-–]\s*/,'').trim();
}
function extractOS(filename){const m=filename.match(/^(\d+)/);return m?m[1]:null;}

function parseWorkbook(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
        const sheetName=wb.SheetNames.find(n=>n.trim().toLowerCase()==='produção')||wb.SheetNames.find(n=>n.trim().toLowerCase().startsWith('produ'));
        if(!sheetName){reject(new Error('Aba "Produção" não encontrada.'));return;}
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,raw:true,defval:null});
        let clienteRaw=null,dataEntrega=null;
        for(let i=0;i<Math.min(rows.length,6);i++){
          const r=rows[i];if(!r||!r[0]) continue;
          const lbl=String(r[0]).trim().toUpperCase();
          if(lbl==='CLIENTE') clienteRaw=r[1];
          if(lbl.startsWith('DATA ENTREGA')) dataEntrega=r[1];
        }
        const osNum=extractOS(file.name);
        const cliente=cleanName(clienteRaw,osNum);
        let produtos=[],current=null,started=false;
        for(const row of rows){
          if(!row) continue;
          const a=row[0],b=row[1],f=row[5];
          if(a==null) continue;
          const aStr=String(a).trim();if(!aStr) continue;
          const aUp=aStr.toUpperCase();
          if(aUp==='MATÉRIA PRIMA'||aUp==='MATERIA PRIMA'){started=true;continue;}
          if(!started) continue;
          if(aUp==='TOTAL') continue;
          if(aUp.includes('VALOR TOTAL')||aUp.includes('VALOR VENDA')) continue;
          if(aStr.startsWith('___')||aUp.includes('RESPONSÁVEL')||aUp.includes('RESPONSAVEL')) break;
          if(b==null){
            let nome=aStr;
            if(osNum) nome=nome.replace(new RegExp('^'+osNum+'\s*[-–]\s*','i'),'');
            current={id:uid(),nome,materiais:[]};
            produtos.push(current);
          } else if(current){
            current.materiais.push({
              id:uid(),descricao:aStr,
              quantidadePedida:typeof b==='number'?b:parseFloat(b)||0,
              unidade:row[2]!=null?String(row[2]).trim():'',
              setorOriginal:f!=null?String(f).trim():'',
              check:false,quantidadeEntregue:'',setorEntregue:f!=null?String(f).trim():'',
              observacao:'',colaborador:'',dataBaixa:'',dataHoraEntrega:'',manual:false
            });
          }
        }
        produtos=produtos.filter(p=>p.materiais.length>0);
        if(!cliente||produtos.length===0){reject(new Error('Não foi possível identificar cliente ou produtos.'));return;}
        let dataStr='';
        if(dataEntrega instanceof Date&&!isNaN(dataEntrega)) dataStr=dataEntrega.toISOString().slice(0,10);
        else if(typeof dataEntrega==='number'){
          const d=XLSX.SSF.parse_date_code(dataEntrega);
          if(d) dataStr=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
        }
        resolve({id:uid(),osNumero:osNum||'',cliente,dataEntrega:dataStr,arquivoOriginal:file.name,status:'Em andamento',criadoEm:new Date().toISOString(),produtos});
      }catch(err){reject(err);}
    };
    reader.onerror=()=>reject(new Error('Falha ao ler o arquivo.'));
    reader.readAsArrayBuffer(file);
  });
}

function formatDate(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-');
  return (d&&m&&y)?`${d}/${m}/${y}`:iso;
}

function useDebounced(v,ms){
  const [val,set]=React.useState(v);
  React.useEffect(()=>{const t=setTimeout(()=>set(v),ms);return()=>clearTimeout(t);},[v,ms]);
  return val;
}

function Icon({name,size=16,color='currentColor',style:st}){
  const tmpl=window._icons[name];
  if(!tmpl) return null;
  const svg=tmpl.replace(/\{s\}/g,size).replace(/\{c\}/g,color);
  return React.createElement('span',{style:{display:'inline-flex',alignItems:'center',flexShrink:0,...st},dangerouslySetInnerHTML:{__html:svg}});
}

function App(){
  const [usuario,setUsuario]=React.useState(null);
  const [nomeInput,setNomeInput]=React.useState('');
  const [ordens,setOrdens]=React.useState(null);
  const [loading,setLoading]=React.useState(true);
  const [saving,setSaving]=React.useState(false);
  const [syncErr,setSyncErr]=React.useState('');
  const [uploadMsg,setUploadMsg]=React.useState('');
  const [uploadErr,setUploadErr]=React.useState('');
  const [showGerenciar,setShowGerenciar]=React.useState(false);
  const [filtroTexto,setFiltroTexto]=React.useState('');
  const [filtroStatus,setFiltroStatus]=React.useState('todas');
  const [filtroOS,setFiltroOS]=React.useState('todas');
  const [sort,setSort]=React.useState({key:null,dir:'asc'});
  const [agruparStatus,setAgruparStatus]=React.useState(false);
  const [filtroBaixa,setFiltroBaixa]=React.useState('');
  const [confirmModal,setConfirmModal]=React.useState(null);
  const [showAddMat,setShowAddMat]=React.useState(false);
  const [addOS,setAddOS]=React.useState('');
  const [addNome,setAddNome]=React.useState('');
  const [addQtd,setAddQtd]=React.useState('');
  const [addUnid,setAddUnid]=React.useState('UN');
  const fileInputRef=React.useRef(null);
  const debouncedTexto=useDebounced(filtroTexto,200);
  const admin=isAdmin(usuario);

  React.useEffect(()=>{const s=localStorage.getItem(USER_KEY);if(s) setUsuario(s);},[]);

  const loadOrdens=React.useCallback(async()=>{
    setLoading(true);setSyncErr('');
    try{setOrdens(await dbLoad());}
    catch(e){setSyncErr('Erro ao conectar com o banco.');setOrdens([]);}
    finally{setLoading(false);}
  },[]);

  React.useEffect(()=>{if(usuario) loadOrdens();},[usuario,loadOrdens]);

  // Auto-refresh a cada 2 minutos
  React.useEffect(()=>{
    if(!usuario) return;
    const timer=setInterval(()=>{if(!saving) loadOrdens();},2*60*1000);
    return()=>clearInterval(timer);
  },[usuario,saving,loadOrdens]);

  const persist=React.useCallback(async next=>{
    setOrdens(next);setSaving(true);setSyncErr('');
    try{await dbSave(next);}
    catch(e){setSyncErr('Erro ao salvar.');}
    finally{setSaving(false);}
  },[]);

  function entrar(){const n=nomeInput.trim();if(!n) return;localStorage.setItem(USER_KEY,n);setUsuario(n);}
  function sair(){localStorage.removeItem(USER_KEY);setUsuario(null);setOrdens(null);}

  async function handleFiles(files){
    setUploadMsg('');setUploadErr('');
    let novas=[],erros=[];
    for(const f of Array.from(files)){
      try{novas.push(await parseWorkbook(f));}
      catch(e){erros.push(`${f.name}: ${e.message}`);}
    }
    if(novas.length>0){
      const current=ordens||[];
      const conflitos=novas.filter(n=>n.osNumero&&current.some(o=>o.osNumero===n.osNumero));
      if(conflitos.length>0){
        const lista=conflitos.map(c=>`O.S. ${c.osNumero} (${c.cliente})`).join(', ');
        if(!window.confirm(`${lista} já existe. Reimportar apaga os dados preenchidos. Continuar?`)){
          if(fileInputRef.current) fileInputRef.current.value='';return;
        }
      }
      let sub=0,add=0,next=[...current];
      for(const nova of novas){
        const idx=nova.osNumero?next.findIndex(o=>o.osNumero===nova.osNumero):-1;
        if(idx>=0){next[idx]={...nova,id:next[idx].id,status:next[idx].status};sub++;}
        else{next=[nova,...next];add++;}
      }
      await persist(next);
      const p=[];if(add) p.push(`${add} nova(s)`);if(sub) p.push(`${sub} atualizada(s)`);
      setUploadMsg(`Importação concluída: ${p.join(', ')}.`);
    }
    if(erros.length) setUploadErr(erros.join(' | '));
    if(fileInputRef.current) fileInputRef.current.value='';
  }

  function updateMaterial(ordemId,produtoId,materialId,patchData,forceConfirm){
    if(forceConfirm){
      const o=ordens.find(x=>x.id===ordemId);
      const p=o&&o.produtos.find(x=>x.id===produtoId);
      const m=p&&p.materiais.find(x=>x.id===materialId);
      setConfirmModal({ordemId,produtoId,materialId,patchData,valorAnterior:m?.quantidadeEntregue||''});
      return;
    }
    persist(ordens.map(o=>o.id!==ordemId?o:{...o,produtos:o.produtos.map(p=>p.id!==produtoId?p:{
      ...p,materiais:p.materiais.map(m=>m.id===materialId?{...m,...patchData}:m)
    })}));
  }

  function confirmarAlteracao(){
    if(!confirmModal) return;
    const {ordemId,produtoId,materialId,patchData}=confirmModal;
    persist(ordens.map(o=>o.id!==ordemId?o:{...o,produtos:o.produtos.map(p=>p.id!==produtoId?p:{
      ...p,materiais:p.materiais.map(m=>m.id===materialId?{...m,...patchData}:m)
    })}));
    setConfirmModal(null);
  }

  function cancelarAlteracao(){
    if(confirmModal){
      const ev=new CustomEvent('reverterQtd',{detail:{materialId:confirmModal.materialId,valor:confirmModal.valorAnterior}});
      window.dispatchEvent(ev);
    }
    setConfirmModal(null);
  }

  function toggleStatus(ordemId){
    persist(ordens.map(o=>o.id!==ordemId?o:{...o,status:o.status==='Finalizada'?'Em andamento':'Finalizada'}));
  }
  function updateDataEntrega(ordemId,novaData){
    if(!admin) return;
    persist(ordens.map(o=>o.id!==ordemId?o:{...o,dataEntrega:novaData}));
  }
  function excluirOrdem(ordemId){
    if(!admin) return;
    if(!window.confirm('Excluir esta O.S.? Ação irreversível.')) return;
    persist(ordens.filter(o=>o.id!==ordemId));
  }
  function deletarMaterialManual(ordemId,produtoId,materialId){
    if(!window.confirm('Excluir este item manual?')) return;
    persist(ordens.map(o=>o.id!==ordemId?o:{...o,produtos:o.produtos.map(p=>p.id!==produtoId?p:{
      ...p,materiais:p.materiais.filter(m=>m.id!==materialId)
    }).filter(p=>p.materiais.length>0)}));
  }
  function adicionarMaterialManual(){
    if(!addOS||!addNome.trim()) return;
    const novoMat={id:uid(),descricao:addNome.trim(),quantidadePedida:parseFloat(addQtd)||0,unidade:addUnid,
      setorOriginal:'',check:false,quantidadeEntregue:addQtd||'',setorEntregue:'',
      observacao:'Adicionado manualmente',colaborador:'',dataBaixa:'',dataHoraEntrega:'',manual:true};
    const next=ordens.map(o=>{
      if(o.osNumero!==addOS) return o;
      const temManual=o.produtos.find(p=>p.nome==='Manual');
      if(temManual) return {...o,produtos:o.produtos.map(p=>p.nome==='Manual'?{...p,materiais:[...p.materiais,novoMat]}:p)};
      return {...o,produtos:[...o.produtos,{id:uid(),nome:'Manual',materiais:[novoMat]}]};
    });
    persist(next);
    setAddNome('');setAddQtd('');setShowAddMat(false);

        row.check?React.createElement(Icon,{name:'CheckCircle2',size:18,color:'#22c55e'}):React.createElement(Icon,{name:'Circle',size:18,color:'#bbb'})
      )
    ),
    React.createElement('td',{style:{...cellSt,width:64}},React.createElement('span',{style:{fontSize:11.5,fontWeight:700,color:'#2563eb',background:'#eff4ff',padding:'2px 6px',borderRadius:5,whiteSpace:'nowrap'}},'#',row.osNumero||'—')),
    React.createElement('td',{style:{...cellSt,width:148},title:row.cliente},row.cliente),
    React.createElement('td',{style:{...cellSt,width:148},title:row.produtoNome},row.produtoNome),
    React.createElement('td',{style:{...cellSt,width:260},title:row.descricao},row.descricao),
    React.createElement('td',{style:{...cellSt,width:82,color:'#555'}},row.quantidadePedida,' ',row.unidade),
    React.createElement('td',{style:{...cellSt,width:92,padding:'3px 6px'}},
      React.createElement('input',{type:'text',disabled,value:qtdLocal,placeholder:String(row.quantidadePedida),
        onChange:e=>setQtdLocal(e.target.value),
        onBlur:e=>{
          const val=e.target.value;
          if(val===row.quantidadeEntregue) return;
          const obsAtual=row.observacao||'';
          const obsAuto=obsAtual===''||obsAtual.startsWith('Entregue por ');
          const novaObs=val&&obsAuto?'Entregue por '+usuario:obsAtual;
          const agora=new Date();
          const dh=val?agora.toLocaleDateString('pt-BR')+' '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
          onUpdateMaterial(row.ordemId,row.produtoId,row.id,{quantidadeEntregue:val,observacao:novaObs,dataHoraEntrega:dh},true);
        },
        onKeyDown:e=>{if(e.key==='Escape') setQtdLocal(row.quantidadeEntregue);},
        style:{...inpSt,...(diverg?{borderColor:'#f59e0b',background:'#fffbeb'}:{})}
      })
    ),
    React.createElement('td',{style:{...cellSt,width:122,padding:'3px 6px'}},
      React.createElement('select',{disabled,value:row.setorEntregue||'',onChange:e=>patch({setorEntregue:e.target.value}),style:{...inpSt,...(setDiv?{borderColor:'#f59e0b'}:{})}},
        React.createElement('option',{value:''},'—'),
        ...SETORES.map(s=>React.createElement('option',{key:s,value:s},s))
      )
    ),
    React.createElement('td',{style:{...cellSt,width:108},title:row.dataHoraEntrega||''},React.createElement('span',{style:{fontSize:11,color:'#444',whiteSpace:'nowrap'}},row.dataHoraEntrega||'—')),
    React.createElement('td',{style:{...cellSt,width:84},title:row.dataBaixa||''},React.createElement('span',{style:{fontSize:11,color:'#444',whiteSpace:'nowrap'}},row.dataBaixa||'—')),
    React.createElement('td',{style:{...cellSt,padding:'3px 6px'},title:row.observacao},React.createElement('input',{type:'text',disabled,value:row.observacao,placeholder:'observação...',onChange:e=>patch({observacao:e.target.value}),style:inpSt})),
    React.createElement('td',{style:{...cellSt,width:108,padding:'3px 6px'},title:row.colaborador},React.createElement('input',{type:'text',disabled,value:row.colaborador,placeholder:'—',onChange:e=>patch({colaborador:e.target.value}),style:inpSt})),
    React.createElement('td',{style:{...cellSt,width:112,textAlign:'center'}},
      React.createElement('span',{style:{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,fontWeight:600,padding:'3px 8px',borderRadius:6,whiteSpace:'nowrap',...(fin?{background:'#dcfce7',color:'#166534'}:{background:'#fff4e0',color:'#a8650f'})}},
        React.createElement(Icon,{name:fin?'Lock':'Unlock',size:10}),' ',row.osStatus)
    )
  );
}

function GerenciarModal({listaOS,onClose,onToggleStatus,onExcluir,onUpdateData,admin}){
  return React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',zIndex:50,display:'flex',alignItems:'center',justifyContent:'center'},onClick:e=>e.target===e.currentTarget&&onClose()},
    React.createElement('div',{style:{background:'#fff',borderRadius:14,width:'min(680px,96vw)',maxHeight:'80vh',display:'flex',flexDirection:'column',boxShadow:'0 8px 32px rgba(0,0,0,.18)'}},
      React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:'1px solid #eee'}},
        React.createElement('span',{style:{display:'flex',alignItems:'center',gap:7,fontSize:15,fontWeight:600}},React.createElement(Icon,{name:'Settings',size:15}),' Gerenciar ordens de serviço'),
        React.createElement('button',{onClick:onClose,style:{background:'transparent',border:'none',cursor:'pointer',color:'#888',display:'flex'}},React.createElement(Icon,{name:'X',size:16}))
      ),
      React.createElement('div',{style:{overflowY:'auto',padding:'8px 12px 16px'}},
        listaOS.length===0
          ?React.createElement('p',{style:{textAlign:'center',color:'#aaa',fontSize:13,padding:'40px 0'}},'Nenhuma ordem importada.')
          :listaOS.map(o=>{
            const fin=o.status==='Finalizada';
            const pct=o._totalMat?Math.round(o._checados/o._totalMat*100):0;
            return React.createElement('div',{key:o.id,style:{display:'flex',alignItems:'center',gap:12,padding:'12px 8px',borderBottom:'1px solid #f2f2f0',flexWrap:'wrap'}},
              React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10,flex:'1 1 240px',minWidth:0}},
                React.createElement('span',{style:{fontSize:12,fontWeight:700,color:'#2563eb',background:'#eff4ff',padding:'3px 8px',borderRadius:6,whiteSpace:'nowrap',flexShrink:0}},'O.S. ',o.osNumero||'—'),
                React.createElement('div',null,
                  React.createElement('div',{style:{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},o.cliente),
                  React.createElement('div',{style:{display:'flex',alignItems:'center',gap:5,marginTop:3}},
                    React.createElement('span',{style:{fontSize:11.5,color:'#aaa',whiteSpace:'nowrap'}},'Entrega:'),
                    admin
                      ?React.createElement('input',{type:'date',value:o.dataEntrega||'',onChange:e=>onUpdateData(o.id,e.target.value),style:{fontSize:12,padding:'3px 6px',border:'1px solid #e2e2de',borderRadius:6,outline:'none',background:'#fff',color:'#333',cursor:'pointer'}})
                      :React.createElement('span',{style:{fontSize:12.5,color:'#555'}},formatDate(o.dataEntrega))
                  )
                )
              ),
              React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,flex:'1 1 160px'}},
                React.createElement('div',{style:{width:100,height:6,borderRadius:3,background:'#eee',overflow:'hidden',flexShrink:0}},
                  React.createElement('div',{style:{height:'100%',borderRadius:3,transition:'width .2s',width:`${pct}%`,background:fin?'#4a9b5e':'#2563eb'}})
                ),
                React.createElement('span',{style:{fontSize:12,color:'#888',whiteSpace:'nowrap'}},`${o._checados}/${o._totalMat} (${pct}%)`)
              ),
              React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6,flexShrink:0}},
                React.createElement('button',{style:{display:'flex',alignItems:'center',gap:5,fontSize:12,fontWeight:600,padding:'6px 12px',borderRadius:7,cursor:'pointer',border:'none',whiteSpace:'nowrap',...(fin?{background:'#e6f4ea',color:'#2f8050',border:'1px solid #c3e6cb'}:{background:'#1a1a1a',color:'#fff'})},onClick:()=>onToggleStatus(o.id)},
                  React.createElement(Icon,{name:fin?'Unlock':'Lock',size:12,color:fin?'#2f8050':'#fff'}),' ',fin?'Reabrir':'Finalizar'),
                admin&&React.createElement('button',{style:{background:'transparent',border:'none',color:'#ccc',cursor:'pointer',padding:4,display:'flex'},onClick:()=>onExcluir(o.id),title:'Excluir'},React.createElement(Icon,{name:'Trash2',size:14,color:'#ccc'}))
              )
            );
          })
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
